gzip on; 
gzip_proxied any; 
gzip_min_length 256;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/m;
upstream shortly_app { server 127.0.0.1:3000; }
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/shortly.crt;
    ssl_certificate_key /etc/nginx/certs/shortly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age-31636000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
    client_max_body_size 1m;

    client_header_timeout 5s; 
    client_body_timeout 5s; 
    send_timeout 5s; 
    keepalive_timeout 15s;

    limit_req_status 429;
 

    location / { proxy_pass http://shortly_app; }
    location /api/admin/ { limit_req zone=admin burst=3 nodelay; proxy_pass http://shortly_app;
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ~* \.(?:css|js|svg|png|ico|woff2)$ { proxy_pass http://shortly_app; proxy_set_header Host $host; expires 7d; }


}

 