upstream shortly_app { server 127.0.0.1:3000; }
server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/shortly.crt;
    ssl_certificate_key /etc/nginx/certs/shortly.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age-31636000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location / { proxy_pass http://shortly_app; }
}

 